name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform 34
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            --sdk_root=$ANDROID_SDK_ROOT 2>&1 | tail -5 || true

      - name: Copy web assets into Android project
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r assets/. android/app/src/main/assets/public/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon 2>&1 | tee /tmp/gradle.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            echo "::error::$(grep -iE 'error:|FAILED|Exception' /tmp/gradle.log | head -8 | tr '\n' ' | ')"
            exit $EXIT
          fi
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Verify APK exists
        run: ls -la android/app/build/outputs/apk/release/

      - name: Sign APK
        run: |
          keytool -genkeypair -v \
            -keystore iqra-release.keystore \
            -alias iqra \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass iqrapass \
            -keypass iqrapass \
            -dname "CN=Iqra, OU=App, O=Baheesa, L=Unknown, S=Unknown, C=US" \
            || { echo "::error::keytool failed"; exit 1; }

          APK=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -1)
          BUILD_TOOLS=$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)
          SIGNER="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner"

          echo "::notice::APK=$APK BUILD_TOOLS=$BUILD_TOOLS SIGNER_EXISTS=$(test -f $SIGNER && echo yes || echo no)"

          $SIGNER sign \
            --ks iqra-release.keystore \
            --ks-alias iqra \
            --ks-pass pass:iqrapass \
            --key-pass pass:iqrapass \
            --out iqra-${{ github.ref_name }}.apk \
            "$APK" \
            || { echo "::error::apksigner failed: APK=$APK BUILD_TOOLS=$BUILD_TOOLS"; exit 1; }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Iqra ${{ github.ref_name }}
          body: |
            ## Iqra ${{ github.ref_name }}

            **Download the APK below and install directly on your Android phone.**
            Enable *Install from unknown sources* in Android settings if prompted.
          files: iqra-${{ github.ref_name }}.apk
          make_latest: true
