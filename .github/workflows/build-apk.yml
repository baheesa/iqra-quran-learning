name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK platform 34
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            --sdk_root=$ANDROID_SDK_ROOT 2>&1 | tail -5 || true

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore ${{ github.workspace }}/iqra-release.jks \
            -alias iqra \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass iqrapass \
            -keypass iqrapass \
            -dname "CN=Iqra, OU=App, O=Baheesa, L=Unknown, S=Unknown, C=US" \
            -storetype JKS

      - name: Copy web assets into Android project
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r assets/. android/app/src/main/assets/public/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build and sign release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          KEYSTORE_PATH: ${{ github.workspace }}/iqra-release.jks
          STORE_PASS: iqrapass
          KEY_ALIAS: iqra
          KEY_PASS: iqrapass

      - name: Copy APK to workspace
        run: |
          APK=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -1)
          echo "Built APK: $APK"
          cp "$APK" iqra.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Iqra ${{ github.ref_name }}
          body: |
            ## Iqra ${{ github.ref_name }}

            **Download the APK below and install directly on your Android phone.**
            Enable *Install from unknown sources* in Android settings if prompted.
          files: iqra.apk
          make_latest: true
