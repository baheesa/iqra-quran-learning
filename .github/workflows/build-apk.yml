name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore iqra-release.keystore \
            -alias iqra \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass iqrapass \
            -keypass iqrapass \
            -dname "CN=Iqra, OU=App, O=Baheesa, L=Unknown, S=Unknown, C=US"

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sign APK
        run: |
          $ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | tail -1)/apksigner sign \
            --ks iqra-release.keystore \
            --ks-alias iqra \
            --ks-pass pass:iqrapass \
            --key-pass pass:iqrapass \
            --out iqra-${{ github.ref_name }}.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Iqra ${{ github.ref_name }}
          body: |
            ## Iqra ${{ github.ref_name }}

            **[📱 Download APK](https://github.com/baheesa/iqra-quran-learning/releases/download/${{ github.ref_name }}/iqra-${{ github.ref_name }}.apk)**

            Install directly on your Android phone — no Play Store needed.
            Enable *Install from unknown sources* in Android settings if prompted.
          files: iqra-${{ github.ref_name }}.apk
          make_latest: true
