name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Copy web assets into Android project
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r assets/. android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Sign APK
        run: |
          keytool -genkey -v \
            -keystore iqra-release.keystore \
            -alias iqra \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass iqrapass \
            -keypass iqrapass \
            -dname "CN=Iqra, OU=App, O=Baheesa, L=Unknown, S=Unknown, C=US"

          BUILD_TOOLS=$(ls /usr/local/lib/android/sdk/build-tools | sort -V | tail -1)
          /usr/local/lib/android/sdk/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks iqra-release.keystore \
            --ks-alias iqra \
            --ks-pass pass:iqrapass \
            --key-pass pass:iqrapass \
            --out iqra-${{ github.ref_name }}.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Iqra ${{ github.ref_name }}
          body: |
            ## Iqra ${{ github.ref_name }}

            **Download the APK below and install directly on your Android phone.**
            Enable *Install from unknown sources* in Android settings if prompted.
          files: iqra-${{ github.ref_name }}.apk
          make_latest: true
